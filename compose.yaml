services:
  admin-db:
    image: postgres:16-alpine
    container_name: locify-admin-db
    environment:
      POSTGRES_USER: locify
      POSTGRES_PASSWORD: locify
      POSTGRES_DB: admin_api
    ports:
      - "5432:5432"
    volumes:
      - admin_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locify -d admin_api"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  admin_db_data:
